name: 杀和尾每日更新
on:
  schedule:
    - cron: '0 14 * * *'    # 北京 22:00
    - cron: '30 15 * * *'   # 北京 23:30
    - cron: '0 17 * * *'    # 北京 01:00(兜底)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装依赖
        run: pip install requests
      - name: 抓数据+回测+生成HTML
        run: python update.py
      - name: 提交更新
        run: |
          git config user.name "fc3d-bot"
          git config user.email "bot@fc3d.local"
          git add fc3d-history.csv single_prediction.json index.html
          git diff --staged --quiet || git commit -m "auto: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
