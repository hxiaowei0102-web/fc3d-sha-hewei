name: fc3d-daily-update
on:
  schedule:
    - cron: '0 14 * * *'
    - cron: '30 15 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 防排队: 同一时间只允许一个运行, 新触发的取消旧的排队
concurrency:
  group: fc3d-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: install
        run: pip install requests numpy
      - name: update
        run: python update_v3.py
      - name: commit
        run: |
          git config user.name "fc3d-bot"
          git config user.email "bot@fc3d.local"
          git add fc3d-history.csv 杀和尾v3.html cache/result.json cache/pool.json engine.py formulas.py bruteforce500.py hedge_core.py fetch.py gen_site.py update_v3.py update.py fetch_data.py .github/workflows/daily.yml
          git diff --staged --quiet || git commit -m "auto: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
