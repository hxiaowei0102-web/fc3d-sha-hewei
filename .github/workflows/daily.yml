name: fc3d-daily-update
on:
  schedule:
    - cron: '0 14 * * *'
    - cron: '30 15 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: install
        run: pip install requests
      - name: update
        run: python update.py
      - name: commit
        run: |
          git config user.name "fc3d-bot"
          git config user.email "bot@fc3d.local"
          git add fc3d-history.csv single_prediction.json index.html update.py fetch_data.py .github/workflows/daily.yml
          git diff --staged --quiet || git commit -m "auto: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
